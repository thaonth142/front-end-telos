  <style>
   
  </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
  <script src="
https://cdn.jsdelivr.net/npm/wowjs@1.1.3/dist/wow.min.js
"></script>
<script>
    new WOW ().init();
</script>
<style>
    .abc {
        display: none;
        background-color: #00000000;
    }
    #mobileMenu{}
</style>
<script>
    function openMobileMenu() {
        document.getElementById("mobileMenu").classList.remove("hidden");
        document.getElementById("mobileMenu").classList.add("flex");
    }
    function closeMobileMenu() {
        document.getElementById("mobileMenu").classList.remove("flex");
        document.getElementById("mobileMenu").classList.add("hidden");
    }
</script>

</head>

<body>
  <div class="container mx-auto flex flex-col ">
    <div class="flex h-20 justify-between items-center">
      <img src="images/logo.png" alt="">
      <div class="hidden md:flex gap-8 text-2xl">
        <div>Services</div>
        <div>Works</div>
        <div>About</div>
        <div>Contact</div>
    
      </div>
      <img onclick="openMobileMenu()" src="images/ico_hamburger.webp" alt="" class="w-8 md:hidden">
    </div>
    <div id="mobileMenu" class="fixed left-0 top-0 size-full bg-[#000000c7] z-10 hidden justify-end">
        <div class="bg-white w-[300px] h-full p-8 flex flex-col items-end gap-10">
            <img onclick="closeMobileMenu()" src="images/ico_hamburger.webp" alt="" class="w-8">
            <div>Services</div>
            <div>Works</div>
            <div>About</div>
            <div>Contact</div>
            
        </div>

    </div>
    <div class="flex flex-col justify-center gap-12 py-20">

      <div class="grid md:col-span-1 sm:grid-cols-3 sm:gap-4 md:gap-7">
        <img src="images/ico_cover_1.png" alt=""

        <img src="images/ico_cover_2.png" alt=""
          class="sm:row-span-1 sm:col-span-2 md:col-span-2 size-full object-cover">
        <img src="images/ico_cover_3.png" alt=""
          class="sm:row-span-1 sm:col-span-2  md:col-span-1 size-full object-cover">
        <img src="images/ico_cover_4.png" alt=""
          class="sm:row-span-1 sm:col-span-1 md:row-span-2 size-full object-cover">
        <img src="images/ico_cover_5.png" alt=""
          class="sm:row-span-1 sm:col-span-1 md:row-span-2 md:col-span-2 size-full object-cover">
        <img src="images/ico_cover_6.png" alt=""
          class="sm:row-span-1 sm:col-span-2 md:col-span-1 size-full object-cover">

    </div>
    <div class="grid sm:grid-cols-2 md:grid-cols-4 py-16 gap-7">
      <div class="flex flex-col flex-1">
        <div class="text-H2">40+</div>
        <div class="text-body1 mb-4">Happy Clients</div>
        <div class="w-full h-1 bg-black"></div>
      </div>
      <div class="flex flex-col flex-1">
        <div class="text-H2">540+</div>
        <div class="text-body1 mb-4">Project Completed</div>
        <div class="w-full h-1 bg-black"></div>
      </div>
      <div class="flex flex-col flex-1">
        <div class="text-H2">300</div>
        <div class="text-body1 mb-4">Dedicated Members</div>
        <div class="w-full h-1 bg-black"></div>
      </div>
      <div class="flex flex-col flex-1">
        <div class="text-H2 wow animate__animated animate__zoomin ">25+</div>
        <div class="text-body1 mb-4">Awards Won</div>
        <div class="w-full h-1 bg-black"></div>
      </div>

                    stroke-linecap="round" />
                <path d="M 255 185 C 300 170, 320 220, 290 240" fill="none" stroke="#374151" stroke-width="3"
                    stroke-linecap="round" />

                <!-- Yarn loops over cat -->
                <path d="M 100 190 Q 150 120 180 200" fill="none" stroke="#3b82f6" stroke-width="2"
                    stroke-linecap="round" />
                <path d="M 250 200 Q 280 150 320 180" fill="none" stroke="#3b82f6" stroke-width="2"
                    stroke-linecap="round" />

        </div>

        <div class="text-content">
            <h1>Oops! We are entangled!</h1>

                <button class="btn btn-outline">Go back</button>
                <button class="btn btn-primary">To home</button>

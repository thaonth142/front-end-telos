<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futuristic Hero Section</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Orbitron:wght@400;700;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <canvas id="particles-canvas"></canvas>

    <header>
        <nav class="navbar">
            <div class="logo">NEO<span class="highlight">VISION</span></div>
            <ul class="nav-links">
                <li><a href="#">Products</a></li>
                <li><a href="#">Solutions</a></li>
                <li><a href="#">Pricing</a></li>
                <li><a href="#" class="btn-nav">Login</a></li>
            </ul>
            <div class="menu-toggle">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </div>
        </nav>
    </header>

    <main>
        <section class="hero">
            <div class="hero-content">
                <div class="badge">Next Gen AI Platform</div>
                <h1 class="hero-title">Experience <br> The <span class="highlight-text">Unknown</span></h1>
                <p class="hero-subtitle">Step into a new dimension of digital interaction. Where human intuition meets
                    artificial intelligence seamlessly.</p>
                <div class="cta-group">
                    <a href="#" class="btn btn-primary">Start Exploring</a>
                    <a href="#" class="btn btn-secondary">View Demo</a>
                </div>
                <div class="stats">
                    <div class="stat-item">
                        <span class="stat-number">98%</span>
                        <span class="stat-label">Efficiency</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-number">50k+</span>
                        <span class="stat-label">Active Users</span>
                    </div>
                </div>
            </div>

            <div class="hero-visual">
                <!-- Abstract Representation of the "Human vs Machine" Concept -->
                <div class="visual-container">
                    <div class="glow-sphere"></div>
                    <div class="interface-ring ring-1"></div>
                    <div class="interface-ring ring-2"></div>
                    <div class="interface-ring ring-3"></div>

                    <div class="hologram-card">
                        <div class="card-line"></div>
                        <div class="card-line short"></div>
                        <div class="card-content">System Online</div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>

</html>
